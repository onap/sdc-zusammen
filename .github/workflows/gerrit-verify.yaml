---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# =============================================================================
# Gerrit patchset verify for sdc/zusammen (Maven).
#
# Replaces the JJB '{project-name}-{stream}-verify-java' job. Gerrit is the
# source of truth; gerrit_to_platform dispatches this workflow when a
# patchset is created and it votes Verified +/-1 on the change.
#
# DEPLOYMENT NOTES:
#   * Discovered by filename: it contains both 'gerrit' and 'verify'.
#   * Must exist on EVERY active branch; dispatches target
#     refs/heads/{GERRIT_BRANCH}.
#   * Requires repository variables GERRIT_SERVER, GERRIT_SSH_USER,
#     GERRIT_KNOWN_HOSTS, GERRIT_URL and the secret GERRIT_SSH_PRIVKEY.
#   * GERRIT_DISABLED runs it manually from the GitHub UI without Gerrit.
#
# TOOLCHAIN NOTES -- every override below was established empirically by
# building the imported tree; none is cargo-culted from the JJB job:
#
#   java_version: '21'
#     Still explicit rather than left to the reusable workflow's
#     auto-detection. The tree was pinned to 11 because gson 2.7 called
#     setAccessible on the private Collections$EmptyList constructor,
#     which JDK 16 denies under strong encapsulation; gson 2.14 does not,
#     and the suite passes on 11, 21 and 25 alike with no --add-opens.
#     java.source/java.target stay at 1.8 so the published bytecode floor
#     does not move under sdc/onboarding, which is what produces the
#     'source value 8 is obsolete' warnings on a JDK this new.
#
#   run_jacoco: false
#     Coverage itself comes from the project's own jacoco-maven-plugin,
#     which the module POMs bind as prepare-agent plus a report execution
#     on the test phase, so every module with tests writes its own
#     target/jacoco.exec and target/site/jacoco. This input drives a
#     different layer: set true, maven-build-action redirects the whole
#     reactor at one shared execution file and adds an aggregate
#     jacoco:report and coverage-badge pass over it. That aggregation is
#     what stays off; where the data lands remains the POMs' business.
#     Do not pair it with -Djacoco.skip -- the plugin honours that
#     property, so the agent never attaches and the lane still goes green
#     on every test while writing no execution data at all.
#
#   -Dmaven.javadoc.skip=true
#     detectJavaApiLink defaults on, so building javadoc reaches out to
#     docs.oracle.com. Javadoc itself succeeds on every JDK tested, so
#     this is not a correctness fix: it removes an egress dependency the
#     verify lane has no need of, and with it the risk of a stall behind
#     harden-runner's block policy.
#
#   mvn_version: '3.9.11'
#     Pinned rather than left to the action default, which happens to be
#     the same value today. This tree is brittle enough that a future
#     default bump should be a deliberate, tested change. Maven 3.6.3
#     (the JJB 'mvn36' setting) also works, but 3.9.11 brings Surefire
#     3.2.5 instead of 2.12.4 and needs no deviation from the default.
#
# No Maven settings.xml is required. zusammen-commons is a module of this
# reactor rather than a coordinate to resolve, and everything else comes
# from Maven Central, so the verify lane needs no ONAP Nexus credentials.
# =============================================================================
name: 'Gerrit Verify'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      GERRIT_BRANCH:
        description: 'Branch that change is against'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_ID:
        description: 'The ID for the change'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_NUMBER:
        description: 'The Gerrit number'
        required: false
        type: string
        default: ''
      GERRIT_CHANGE_URL:
        description: 'URL to the change'
        required: false
        type: string
        default: ''
      GERRIT_EVENT_TYPE:
        description: 'Type of Gerrit event'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_NUMBER:
        description: 'The patch number for the change'
        required: false
        type: string
        default: ''
      GERRIT_PATCHSET_REVISION:
        description: 'The revision sha'
        required: false
        type: string
        default: ''
      GERRIT_PROJECT:
        description: 'Project in Gerrit'
        required: false
        type: string
        default: ''
      GERRIT_REFSPEC:
        description: 'Gerrit refspec of change'
        required: false
        type: string
        default: ''
      GERRIT_DISABLED:
        description: 'Run without Gerrit components'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Clear any previous Verified vote so the change starts from a clean state.
  clear-vote:
    name: 'Clear Gerrit Vote'
    if: inputs.GERRIT_DISABLED != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: 'Clear votes'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@1e3eae766b3de755a2e87aa216cedebbaf9c8292  # v1.1.3
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
      - name: 'Allow replication'
        run: sleep 10s

  build-test:
    name: 'Maven Build/Test'
    needs: clear-vote
    if: >-
      always()
      && (needs.clear-vote.result == 'success'
          || needs.clear-vote.result == 'skipped')
    permissions:
      contents: read
      pull-requests: read  # repository-metadata-action queries PR data
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/java-workflows/.github/workflows/maven-build-test.yaml@b70c495c2a75745b7e1bcdcb8c64ad71df0d1ed3  # v0.2.2
    with:
      # When GERRIT_DISABLED is true the gerrit_* values are blanked so the
      # reusable workflow falls back to a standard checkout.
      # yamllint disable-line rule:line-length
      gerrit_refspec: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_REFSPEC || '' }}
      # yamllint disable-line rule:line-length
      gerrit_project: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_PROJECT || '' }}
      # yamllint disable-line rule:line-length
      gerrit_branch: ${{ !inputs.GERRIT_DISABLED && inputs.GERRIT_BRANCH || '' }}
      # gerrit_url falls back to the GERRIT_URL repository variable.
      #
      # See TOOLCHAIN NOTES above; each value is load-bearing.
      java_version: '21'
      mvn_version: '3.9.11'
      run_jacoco: false
      mvn_params: '-Dmaven.javadoc.skip=true'
      # All 1734 tests pass on JDK 21, so the lane gates on them.
      test_permit_fail: false
      # Audit, do not block. The 18 findings this was opened for -- one
      # critical -- sat in netty 4.0.56.Final and guava 19.0, both
      # transitive through cassandra-driver-core, and in gson 2.7. All
      # three are bumped as of this change, and OSV reports nothing open
      # against what the reactor now resolves. The flag survives one more
      # round because that is measured locally, not from the lane's own
      # report; set it false once a verify run confirms Grype agrees.
      grype_permit_fail: true

  # Report the overall workflow conclusion back to Gerrit as a Verified vote.
  vote:
    name: 'Set Gerrit Vote'
    if: ${{ always() && inputs.GERRIT_DISABLED != true }}
    needs: [clear-vote, build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # workflow-conclusion queries the Actions API to list this run's jobs
      actions: read  # required by im-open/workflow-conclusion
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: 'Get conclusion'
        # yamllint disable-line rule:line-length
        uses: im-open/workflow-conclusion@fce18569e28a9f2ed1feca1e6d4251e6a7365fdc  # v2.2.4
      - name: 'Set vote'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@1e3eae766b3de755a2e87aa216cedebbaf9c8292  # v1.1.3
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ env.WORKFLOW_CONCLUSION }}
